; PlatformIO project configuration for the ArdunixNix6 / ArdunixNix4 V2 firmware.
;
;   pio run                             build both variants
;   pio run -e nixie6digit              build the 6 digit firmware
;   pio run -e nixie4digit -t upload    build and flash the 4 digit firmware
;   pio run -t clean                    remove build products
;   pio device monitor                  open a serial monitor
;
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src
lib_dir = lib

[env]
platform = atmelavr
framework = arduino

; Bare ATmega328P at 16 MHz / 5 V, as fitted to the Classic Rev6 and
; Modular Rev 3.01 clock boards and flashed through the FTDI header.
; If you build on stock Arduino hardware instead, swap the two lines below for:
;   board = uno                           upload_speed = 115200
;   board = nanoatmega328                 upload_speed = 57600   (old bootloader)
;   board = nanoatmega328new              upload_speed = 115200
board = pro16MHzatmega328
upload_speed = 57600

; The sketch is tight on flash, so keep the Arduino default -Os.
;
; The atmelavr platform turns on -Wall for everything it builds, including the
; vendored libraries under lib/. Those are upstream code we do not maintain and
; their warnings drown out warnings about our own sources, so -Wall is removed
; globally and put back for src/ only.
build_unflags =
    -Wall
build_src_flags =
    -Wall

; The clock libraries are vendored under lib/ so that a build here is
; reproducible and matches the ZIPs shipped for the Arduino IDE.
; Nothing is pulled from the PlatformIO registry.

; The two firmware variants are separate programs that share no code, so each
; gets its own environment and compiles only its own directory under src/.

[env:nixie6digit]
build_src_filter = +<FirmwareV2/>

[env:nixie4digit]
build_src_filter = +<FirmwareV2-4Digit/>
