; PlatformIO project configuration for the ArdunixNix6 / ArdunixNix4 V2
; clock firmware and its ESP8266 time provider.
;
;   pio run                                 build everything
;   pio run -e nixie6digit                  build the 6 digit clock firmware
;   pio run -e nixie4digit -t upload        build and flash the 4 digit firmware
;   pio run -e wifitimeprovider -t upload   build and flash the ESP8266 module
;   pio run -t clean                        remove build products
;   pio device monitor                      open a serial monitor
;
; The three targets are separate programs that share no code, so each has its
; own environment and compiles only its own directory under src/.
;
; Docs: https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = src

; ----------------------------------------------------------------------------
; Shared settings for the two ATmega328P clock firmware variants.
;
; A bare ATmega328P at 16 MHz / 5 V, as fitted to the Classic Rev6 and
; Modular Rev 3.01 clock boards and flashed through the FTDI header.
; If you build on stock Arduino hardware instead, swap the two lines below for:
;   board = uno                           upload_speed = 115200
;   board = nanoatmega328                 upload_speed = 57600   (old bootloader)
;   board = nanoatmega328new              upload_speed = 115200
;
; The sketches are tight on flash, so keep the Arduino default -Os.
;
; The atmelavr platform turns on -Wall for everything it builds, including the
; libraries. Those are upstream code we do not maintain and their warnings
; drown out warnings about our own sources, so -Wall is removed globally and
; put back for src/ only.
;
; Library versions are pinned. The copies that used to be committed to this
; repository were Time 1.5, DS3231 at a 1.0.x snapshot and Adafruit NeoPixel
; 1.0.0. Time 1.5 is still on the registry and is byte for byte what we had.
; The registry's oldest DS3231 and NeoPixel are newer than the copies we
; carried, so those two move forward; only stable get/set API is used by this
; firmware. Do not float these without rebuilding and checking the flash use.
; ----------------------------------------------------------------------------
[avr_base]
platform = atmelavr
framework = arduino
board = pro16MHzatmega328
upload_speed = 57600
build_unflags =
    -Wall
build_src_flags =
    -Wall
lib_deps =
    paulstoffregen/Time@1.5
    northernwidget/DS3231@1.1.2
    adafruit/Adafruit NeoPixel@1.1.3

; ----------------------------------------------------------------------------
; The 6 digit firmware.
;
; src/Firmware6Digit/ is one source tree that covers both clock generations.
; The hardware is selected by exactly one define, passed here and nowhere else
; - there is no variant define left in the source. See the "Hardware variant
; selection" block at the top of src/Firmware6Digit/main.cpp.
;
;   FWV2           Classic Rev6 and Modular Rev 3.01, which share a pinout
;                  (NeoPixel backlight, PIR on A3)
;   FWV1           Classic Rev4 / Rev5, All-In-One IN-14, Arduino AIO shield
;                  (RAGB backlight on three PWM pins, no PIR, no DP)
;   FWV1_AIO_REV1  As FWV1, for the All-In-One Rev1 tube wiring
;
; Early Modular Rev3 boards are not covered - see the note in main.cpp and use
; a firmware from before version 356.
; ----------------------------------------------------------------------------
[nixie6digit_base]
extends = avr_base
build_src_filter = +<Firmware6Digit/>

[env:nixie6digitV2]
extends = nixie6digit_base
build_flags = -DFWV2

[env:nixie6digitV1]
extends = nixie6digit_base
build_flags = -DFWV1

[env:nixie6digitV1aio]
extends = nixie6digit_base
build_flags = -DFWV1_AIO_REV1

; ----------------------------------------------------------------------------
; The 4 digit firmware. Same arrangement as the 6 digit one above, but with
; only two variants - the All-In-One Rev1 is a 6 digit clock.
;
; The 4 and 6 digit trees are still separate. Their display layouts differ in
; function signatures and menu structure, not just in pin maps, so folding them
; together needs a refactor rather than another define.
; ----------------------------------------------------------------------------
[nixie4digit_base]
extends = avr_base
build_src_filter = +<Firmware4Digit/>

[env:nixie4digitV2]
extends = nixie4digit_base
build_flags = -DFWV2

[env:nixie4digitV1]
extends = nixie4digit_base
build_flags = -DFWV1

; ----------------------------------------------------------------------------
; ESP8266 WiFi time provider.
;
; The sketch header pins the toolchain it was written against: Arduino core
; 2.7.4, which is espressif8266 2.6.3 here, and library versions it says must
; match EXACTLY for a clean compile. They are pinned below for that reason -
; do not float them without testing.
;
; The remaining settings reproduce the Arduino IDE board menu recorded in the
; sketch header: Generic ESP8266 Module, 160 MHz CPU, 40 MHz QIO flash,
; 1M flash with 64k SPIFFS, lwIP v2 low memory, 115200 upload.
; ----------------------------------------------------------------------------
[env:wifitimeprovider]
platform = espressif8266@2.6.3
framework = arduino
board = esp01_1m
board_build.f_cpu = 160000000L
board_build.f_flash = 40000000L
board_build.flash_mode = qio
board_build.ldscript = eagle.flash.1m64.ld
upload_speed = 115200
build_src_filter = +<WifiTimeProviderESP8266/>
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
; Taken from upstream git tags rather than the PlatformIO registry, which no
; longer carries ArduinoJson 5.13.2 or WiFiManager 0.15.0. ESPAsyncUDP has no
; releases at all, so its master HEAD is pinned by commit for reproducibility.
lib_deps =
    paulstoffregen/Time@1.5
    https://github.com/bblanchon/ArduinoJson.git#v5.13.2
    https://github.com/tzapu/WiFiManager.git#0.15.0
    https://github.com/me-no-dev/ESPAsyncUDP.git#697c75a0255e5dccf91b4ef8b5cc28c569b3bac9
